[project]
name = "alignment-mcp"
version = "0.1.0"
description = "Agent-shaped MCP peer over case_prep.application / caseflow. Owns no physics."
requires-python = ">=3.9"
dependencies = [
    "case-prep",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
alignment-mcp = "alignment_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
