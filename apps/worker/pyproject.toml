[project]
name = "case-prep"
version = "0.1.0"
description = "Phase 2A automated case-prep spike: count -> localize -> align -> 6-DoF pose -> gate -> report"
requires-python = ">=3.9"
dependencies = [
    # BOOLEAN DETERMINISM PINS (boolean-engine plan W4/Stage 0, 2026-08-13): the
    # unpinned env was a standing risk the plan names outright — "same inputs must
    # yield the same artifact bytes" cannot hold if the kernel underneath can drift
    # between installs. These four are pinned EXACT to the versions this worktree's
    # own venv is running (read via `.venv/bin/python -c "import trimesh, numpy,
    # scipy; print(...)"` + `pip show manifold3d`, 2026-08-13); everything else below
    # stays loose on purpose — only the geometry stack a kernel swap or a boolean
    # result could be sensitive to gets the exact pin.
    "numpy==2.0.2",
    "scipy==1.13.1",
    "trimesh==4.12.2",
    "manifold3d==3.5.2",     # true boolean engine for the closed-model artifacts
    # (§10-AS.11 spike, 2026-08-11: solidified 276794487's scan skirt-to-base,
    # watertight, and cut the envelope recess by CSG — the competitor's route)
    "pydantic>=2.0",
    "jinja2>=3.0",
    "open3d>=0.18",
    "scikit-image>=0.21",   # marching cubes for SDF-CSG surface extraction
    "rtree>=1.0",            # spatial index for trimesh point-in-mesh queries
]

[project.optional-dependencies]
# pytest-xdist is NOT optional tooling: the Makefile's lanes pass `-n auto --dist
# loadfile`, so a venv without it fails on an unknown flag rather than merely running
# slowly. It is declared here so `make install` produces a venv the Makefile can drive.
dev = ["pytest>=7.0", "matplotlib>=3.7", "pytest-json-report>=1.5", "pytest-xdist>=3.5"]

[project.scripts]
case-prep = "case_prep.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# THE BATTERY HAS TWO LANES. `make test` runs EVERYTHING and remains the certification
# gate — this marker weakens nothing. `make test-fast` runs `-m "not slow"`: the lane you
# can afford between edits, so a broken invariant is found in seconds instead of at the
# end of a 24-minute wait (the measured cost of having only one lane: people stop running
# it). A test is marked `slow` on MEASUREMENT (pytest --durations), never on suspicion:
# re-measure before adding or removing a mark, and mark whole classes/modules only when
# the measurement says the whole thing is slow.
markers = [
    "slow: measured >1s — real-data/pipeline/end-to-end work. Excluded from `make test-fast` ONLY.",
]
filterwarnings = [
    # third-party env noise (LibreSSL vs OpenSSL on macOS system python); not our code
    "ignore::urllib3.exceptions.NotOpenSSLWarning",
    # numpy 2.0 + macOS Accelerate BLAS sets spurious FP-status flags on valid matmul
    # calls (results verified correct by tests); env artifact, not a logic signal.
    "ignore:.*encountered in matmul:RuntimeWarning",
]

# Notes:
# - Python 3.9 is the spike interpreter (Open3D 0.18 arm64 wheel target on this host).
#   Production CI/container pins 3.11 per the design docs.
# - Open3D is imported ONLY inside adapters/open3d_engine.py (lazily), so the domain
#   core, synthetic generator, metrics and report are testable without it.
