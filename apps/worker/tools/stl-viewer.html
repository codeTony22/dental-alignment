<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STL viewer — case-prep</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.5 -apple-system, Segoe UI, Roboto, sans-serif; }
  body { background: #14151a; color: #e7e8ec; }
  #app { position: fixed; inset: 0; }
  #panel {
    position: fixed; top: 12px; left: 12px; width: 280px; max-height: calc(100% - 24px); overflow: auto;
    background: rgba(28,30,38,.92); border: 1px solid #34363f; border-radius: 12px; padding: 14px;
    backdrop-filter: blur(8px); z-index: 10;
  }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { color: #9a9ca6; margin: 0 0 12px; font-size: 11px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid #2a2c34; }
  .row:first-of-type { border-top: 0; }
  .swatch { width: 13px; height: 13px; border-radius: 3px; flex: 0 0 auto; cursor: pointer; border: 1px solid rgba(255,255,255,.2); }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: #8a8c96; font-size: 10px; }
  .x { color: #8a8c96; cursor: pointer; padding: 0 3px; }
  .x:hover { color: #e24b4a; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  button { background: #2a2d37; color: #e7e8ec; border: 1px solid #3a3d48; border-radius: 7px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
  button:hover { background: #343845; }
  #hint { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 5; }
  #hint div { color: #6b6d78; font-size: 16px; border: 2px dashed #34363f; border-radius: 16px; padding: 28px 40px; text-align: center; }
  .drag #hint div { border-color: #378add; color: #b5d4f4; }
  .empty-note { color: #8a8c96; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="panel">
  <h1>STL viewer</h1>
  <p class="sub">drag STL files anywhere · scroll = zoom · drag = orbit · right-drag = pan</p>
  <div id="files"></div>
  <p class="empty-note" id="emptyNote">No files yet — drop some in.</p>
  <div class="controls">
    <button id="wire">Wireframe</button>
    <button id="reset">Reset view</button>
    <button id="clear">Clear all</button>
  </div>
</div>
<div id="hint"><div>Drop .stl files here</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14151a);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 100000);
camera.position.set(40, 40, 60);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(1, 1, 1); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-1, -0.5, -1); scene.add(fill);
const grid = new THREE.GridHelper(200, 40, 0x2a2c34, 0x222430); scene.add(grid);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const group = new THREE.Group(); scene.add(group);
const loader = new STLLoader();
const meshes = [];
let wireframe = false;

// colour by filename so input / our-output / reference read instantly
const PALETTE = ['#7f77dd', '#d85a30', '#1d9e75', '#378add', '#d4537e', '#ba7517'];
function colourFor(name, i) {
  const n = name.toLowerCase();
  if (n.includes('input') || n.includes('orig') || n.includes('arch') || n.includes('scan-')) return '#aeb1bd';
  if (n.includes('generated') || n.includes('ours') || n.includes('error')) return '#d85a30';
  if (n.includes('reference') || n.includes('true') || n.includes('final')) return '#1d9e75';
  if (n.includes('intersection') || n.includes('_and') || n.includes('overlap')) return '#1d9e75';
  if (n.includes('difference')) return '#378add';
  return PALETTE[i % PALETTE.length];
}

function addSTL(name, arrayBuffer) {
  let geo;
  try { geo = loader.parse(arrayBuffer); } catch (e) { console.error(name, e); return; }
  geo.computeVertexNormals();
  const colour = colourFor(name, meshes.length);
  const mat = new THREE.MeshStandardMaterial({ color: colour, metalness: 0.05, roughness: 0.75,
    flatShading: false, side: THREE.DoubleSide, transparent: true, opacity: 0.92 });
  const mesh = new THREE.Mesh(geo, mat);
  group.add(mesh);
  const verts = geo.attributes.position.count;
  meshes.push({ name, mesh, colour, verts });
  renderList();
  fitView();
}

function renderList() {
  const el = document.getElementById('files');
  el.innerHTML = '';
  document.getElementById('emptyNote').style.display = meshes.length ? 'none' : 'block';
  meshes.forEach((m, i) => {
    const row = document.createElement('div'); row.className = 'row';
    const sw = document.createElement('div'); sw.className = 'swatch'; sw.style.background = m.colour;
    sw.title = 'toggle visibility';
    sw.onclick = () => { m.mesh.visible = !m.mesh.visible; sw.style.opacity = m.mesh.visible ? 1 : 0.25; };
    const nm = document.createElement('div'); nm.className = 'name';
    nm.innerHTML = m.name + '<div class="meta">' + m.verts.toLocaleString() + ' verts</div>';
    const x = document.createElement('div'); x.className = 'x'; x.textContent = '✕'; x.title = 'remove';
    x.onclick = () => { group.remove(m.mesh); meshes.splice(i, 1); renderList(); };
    row.append(sw, nm, x); el.appendChild(row);
  });
}

function fitView() {
  if (!meshes.length) return;
  const box = new THREE.Box3();
  meshes.forEach(m => box.expandByObject(m.mesh));
  const size = box.getSize(new THREE.Vector3()).length();
  const center = box.getCenter(new THREE.Vector3());
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(size*0.6, size*0.5, size*0.8));
  camera.near = size/1000; camera.far = size*100; camera.updateProjectionMatrix();
  grid.position.set(center.x, box.min.y, center.z);
}

// drag & drop
const hint = document.getElementById('hint');
['dragenter','dragover'].forEach(e => addEventListener(e, ev => { ev.preventDefault(); document.body.classList.add('drag'); }));
['dragleave','drop'].forEach(e => addEventListener(e, ev => { ev.preventDefault(); document.body.classList.remove('drag'); }));
addEventListener('drop', ev => {
  hint.style.display = 'none';
  [...ev.dataTransfer.files].filter(f => f.name.toLowerCase().endsWith('.stl')).forEach(f => {
    const r = new FileReader();
    r.onload = () => addSTL(f.name, r.result);
    r.readAsArrayBuffer(f);
  });
});

document.getElementById('wire').onclick = () => { wireframe = !wireframe; meshes.forEach(m => m.mesh.material.wireframe = wireframe); };
document.getElementById('reset').onclick = fitView;
document.getElementById('clear').onclick = () => { meshes.slice().forEach(m => group.remove(m.mesh)); meshes.length = 0; renderList(); hint.style.display = 'flex'; };

addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
(function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
