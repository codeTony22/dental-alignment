[project]
name = "case-api"
version = "0.1.0"
description = "UI-shaped REST peer of the BFF and alignment MCP. Owns no physics."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100",
    "pydantic>=2.0",
    "case-prep",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.24"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::urllib3.exceptions.NotOpenSSLWarning",
    "ignore:.*encountered in matmul:RuntimeWarning",
]
