<svg width="240" height="280" viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ArTech Software Labs badge">
  <defs>
    <linearGradient id="badgeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12994a"/><stop offset="1" stop-color="#0a6d2e"/>
    </linearGradient>
